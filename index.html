<section class='story-section' data-bg='pic/03family-digital-human.png'><div class='parallax-bg'></div><div class='section-copy reveal'><p class='section-kicker'>CHAPTER 02</p><h2>思念如何變成技術服務</h2><p class='section-lead'>數位人把遺憾轉為可互動的情感介面。</p></div></section>
<section class='story-section' data-bg='pic/04val-kilmer-ai.png'><div class='parallax-bg'></div><div class='section-copy reveal'><p class='section-kicker'>CHAPTER 03</p><h2>數位人如何被製作？</h2><p class='section-lead'>由聲音、影像、語言模型與互動系統串接而成。</p></div><div class='flow-map reveal'><button class='flow-node' data-modal-title='資料蒐集' data-modal-text='製作數位人前，必須先取得逝者生前留下的影像、語音與文字資料。素材越接近日常說話狀態，AI越能模擬其語氣與神態。' data-modal-tags='影像資料,語音素材,個人記憶'>資料蒐集</button><span class='flow-line'></span><button class='flow-node' data-modal-title='模型處理' data-modal-text='資料會被導入多項技術系統，包括聲音克隆、語音辨識、文字轉語音、嘴型同步與臉部動作同步，讓數位人不只是「像」，也能「說話」。' data-modal-tags='Voice Cloning,ASR,TTS,Lip Sync'>模型處理</button><span class='flow-line'></span><button class='flow-node' data-modal-title='知識庫建立' data-modal-text='若要讓數位人能回應問題，需要建立個人知識庫，包括生平、關係、個性、常用語氣與重要記憶。' data-modal-tags='Knowledge Base,人格設定,記憶資料'>知識庫建立</button><span class='flow-line'></span><button class='flow-node' data-modal-title='互動生成' data-modal-text='使用者輸入文字或語音後，系統透過大語言模型生成回應，再轉成聲音與影像輸出，形成即時互動。' data-modal-tags='LLM,即時互動,語音輸出'>互動生成</button><span class='flow-line'></span><button class='flow-node' data-modal-title='使用場景' data-modal-text='目前數位人可被用於告別式、婚禮、家庭陪伴與長照場景，但也因此產生授權、依賴與倫理界線問題。' data-modal-tags='告別式,長照,陪伴,倫理'>使用場景</button></div><figure class='floating-figure reveal'><img src='pic/10tech-process.png' alt='技術流程'><figcaption>圖：數位人技術流程示意。</figcaption></figure></section>
